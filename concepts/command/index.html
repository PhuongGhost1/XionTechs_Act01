    <!-- No favicon request until the identity is regenerated (design doc, open question 14). -->
    <link rel="icon" href="data:," />
    <!-- Geist, the display and body face. Vite rewrites this URL to the hashed file in the build. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Pre-paint state (design doc 10.3, 11.3 item 3). Runs before first paint so READ | RAW and
      // MOTION never flash. It writes the same two attributes as contract/attributes.js and reads
      // the same keys (xt-view, xt-motion). Every storage access is guarded: it can throw.
      ;(function () {
        var d = document.documentElement
        var store = function (key) {
          try {
            return localStorage.getItem(key)
          } catch (e) {
            return null
          }
        }
        var view = 'read'
        try {
          if (new URLSearchParams(location.search).get('view') === 'raw') view = 'raw'
        } catch (e) {}
        if (view === 'read' && store('xt-view') === 'raw') view = 'raw'
        var reduced = false
        try {
          reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
        } catch (e) {}
        var saved = store('xt-motion')
        // Off when the OS asks for reduced motion, unless the visitor deliberately turned it on.
        var motion = reduced ? (saved === 'on' ? 'on' : 'off') : saved === 'off' ? 'off' : 'on'
        d.setAttribute('data-view', view)
        d.setAttribute('data-motion', motion)
      })()
    </script>
