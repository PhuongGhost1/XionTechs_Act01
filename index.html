      rel="stylesheet"
    />
    <style>
      /* Paint the page navy before the stylesheet loads, so there is no white flash. The inline
         script below overrides this instantly for a returning visitor who chose a different
         theme (src/components/theme.js applies the same choice once the JS bundle runs). */
      html { background: #071b34; color-scheme: dark; }
    </style>
    <script>
      (function () {
        try {
          var bg = { graphite: '#141518', paper: '#f3f5f8', linen: '#faf6ed' };
          var saved = localStorage.getItem('xiontechs-theme');
          var theme = bg[saved] ? saved : null;
          if (!theme && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) theme = 'paper';
          if (theme) {
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.background = bg[theme] || '#071b34';
            document.documentElement.style.colorScheme = theme === 'graphite' ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
